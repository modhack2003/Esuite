name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: esuite-ui-starter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design/prototype/package-lock.json
      - run: npm ci
        working-directory: design/prototype
      - run: npm run typecheck && npm run build
        working-directory: design/prototype
      - name: Generated preview matches source
        run: git diff --exit-code -- docs/ui/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.51.1
          python -m playwright install --with-deps chromium
      - name: Verify real concept interactions and generate screenshots
        run: python tools/verify_ui.py --screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: esuite-ui-screenshots
          path: docs/assets/ui-*.png
          retention-days: 7
