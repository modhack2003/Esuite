name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease assembleValidation assembleValidationAndroidTest --no-daemon
      - name: Verify production publication guards with disposable fixture signer
        run: python3 tools/test_release_guards.py
      - uses: actions/upload-artifact@v4
        with:
          name: esuite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: esuite-unsigned-release-validation
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/validation/*.apk
            app/build/outputs/apk/androidTest/validation/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          retention-days: 7
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design/prototype/package-lock.json
      - run: npm ci
        working-directory: design/prototype
      - run: npm run typecheck && npm run build
        working-directory: design/prototype
      - name: Generated preview matches source
        run: git diff --exit-code -- docs/ui/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify real concept interactions and generate screenshots
        run: |
          python tools/verify_ui.py --screenshots
          python tools/verify_inspector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esuite-ui-screenshots
          path: docs/assets/ui-*.png
          retention-days: 7
  android-device:
    needs: android
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {api: '28', target: google_apis}
          - {api: '29', target: google_apis}
          - {api: '30', target: google_apis}
          - {api: '31', target: google_apis}
          - {api: '32', target: google_apis}
          - {api: '33', target: google_apis}
          - {api: '34', target: google_apis}
          - {api: '35', target: google_apis}
          - {api: '36', target: google_apis_ps16k}
          - {api: '37.0', target: google_apis_ps16k}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: esuite-unsigned-release-validation
          path: ci-apks
      - name: Give ephemeral runner access to KVM
        run: |
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Verify optimized native app on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            python3 tools/instrument_apk.py
            adb shell am start -W -n dev.esuite.app.validation/dev.esuite.app.MainActivity
            adb exec-out screencap -p > optimized-native-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-reports-api-${{ matrix.api }}
          path: |
            native-test-results/
            optimized-native-home.png
          retention-days: 7
