name: Verify signed browser layout
on:
  push:
    branches: ['release/1.0.8-adaptive-check']
permissions:
  contents: read
jobs:
  adaptive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: python3 tools/pin_android_tools.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the independent device harness
        run: ./gradlew :ui-tests:assembleDebug --no-daemon
      - name: Download and verify the public production APK
        run: |
          curl -fsSL --retry 2 https://github.com/modhack2003/Esuite/releases/download/v1.0.8/ESuite-1.0.8.apk -o ESuite-1.0.8.apk
          echo 'b94e3d5ffb43b086782e373da8db367656528c721e288b817c84380de0fec191  ESuite-1.0.8.apk' | sha256sum -c
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
          mkdir adaptive-results
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '35'
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install ESuite-1.0.8.apk
            adb install -t ui-tests/build/outputs/apk/debug/ui-tests-debug.apk
            adb shell am instrument -w -r -e class dev.esuite.uitests.BrowserAdaptiveUiTest dev.esuite.uitests/androidx.test.runner.AndroidJUnitRunner > adaptive-results/test.txt
            adb pull /sdcard/Android/data/dev.esuite.uitests/files adaptive-results/ui-evidence
            cat adaptive-results/test.txt
            grep -F 'OK (1 test)' adaptive-results/test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-1.0.8-adaptive-layout
          path: adaptive-results/
